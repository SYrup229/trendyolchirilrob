name: Build Windows .exe

# Triggers:
#   - push to main: smoke build (artifact uploaded, no release)
#   - tag push v*:  release build (attached to a GitHub Release)
#   - manual:       workflow_dispatch from the Actions tab
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/upload a Release on tag pushes

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: trendyol_full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trendyol_full/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src app.py build_exe.py

      - name: Build executable
        run: python build_exe.py

      - name: Show dist contents
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length

      # continue-on-error: a full artifact-storage quota must never block the
      # Release step below — the Release upload is separate from Actions storage.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TrendyolFull-${{ github.sha }}.exe
          path: trendyol_full/dist/TrendyolFull.exe
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: trendyol_full/dist/TrendyolFull.exe
          generate_release_notes: true
